name: Publish Selected Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git Tag (e.g., v5.0.0)'
        required: true
        default: 'v5.0.0'
      release_name:
        description: 'Release Title (e.g., Aura v5.0.0)'
        required: true
        default: 'Aura v5.0.0'
      release_notes:
        description: 'Changelog / Release Notes'
        required: false
        default: 'Aura v5.0.0 release with Liquid Glass GPU stabilization, frosted glass adaptive icon, and full rebranding.'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
      LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
      EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Ensure Signing Keystore
        run: |
          if [ -z "$SIGNING_KEY" ] && [ -z "$RELEASE_STORE_FILE" ]; then
            echo "Auto-generating release keystore for packaging..."
            mkdir -p /tmp/keystore
            keytool -genkeypair -v -keystore /tmp/keystore/release.keystore -alias aura_release -keyalg RSA -keysize 2048 -validity 10000 -storepass androidaura -keypass androidaura -dname "CN=Aura, O=Aura, C=US"
            echo "RELEASE_STORE_FILE=/tmp/keystore/release.keystore" >> $GITHUB_ENV
            echo "RELEASE_STORE_PASSWORD=androidaura" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=aura_release" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=androidaura" >> $GITHUB_ENV
          fi

      - name: Build Android 10 Release APKs (compressed + raw)
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ env.RELEASE_STORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS || secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'aura_release' }}
          RELEASE_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_FILE: ${{ env.RELEASE_STORE_FILE }}
        run: ./gradlew assembleRelease assembleRawRelease --stacktrace

      - name: Stage Android 10 Final APKs
        run: |
          mkdir -p final_apk
          TAG="${{ inputs.tag_name }}"
          # Clean tag string for filenames (strip leading v if present)
          CLEAN_TAG="${TAG#v}"
          # Universal release (Android 10+, R8 + ProGuard + shrinkResources)
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/Aura-v${CLEAN_TAG}-universal.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/Aura-v${CLEAN_TAG}-universal.apk
          fi
          # Universal uncompressed variant (Android 10+, raw debuggable/unminified)
          if [ -f "app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk" ]; then
            cp app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk final_apk/Aura-v${CLEAN_TAG}-universal-uncompressed.apk
          else
            cp app/build/outputs/apk/rawRelease/app-rawRelease.apk final_apk/Aura-v${CLEAN_TAG}-universal-uncompressed.apk
          fi
          rm -rf app/build/outputs/apk/release/*

      - name: Build Android 7.0 Legacy APK (compressed)
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          LASTWAVE_LYRICS_TOKEN: ${{ secrets.LASTWAVE_LYRICS_TOKEN }}
          LASTWAVE_LYRICS_URL: ${{ secrets.LASTWAVE_LYRICS_URL }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ env.RELEASE_STORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS || secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'aura_release' }}
          RELEASE_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_FILE: ${{ env.RELEASE_STORE_FILE }}
        run: ./gradlew assembleRelease -PminSdk=24 --stacktrace

      - name: Stage Android 7 Final APK
        run: |
          TAG="${{ inputs.tag_name }}"
          CLEAN_TAG="${TAG#v}"
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/Aura-v${CLEAN_TAG}-android7.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/Aura-v${CLEAN_TAG}-android7.apk
          fi
          ls -lh final_apk/

      - name: Verify APK signatures + publish checksums
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under $SDKROOT — skipping verification"
          else
            for apk in final_apk/*.apk; do
              echo "Verifying $apk ..."
              "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::APK failed signature verification: $apk"; exit 1; }
              CERT_SHA=$("$APKSIGNER" verify --print-certs "$apk" 2>/dev/null | grep -i 'SHA-256 digest' | head -n1 | awk '{print $NF}' | tr 'A-F' 'a-f')
              echo "Signature verified for $apk (SHA-256: $CERT_SHA)"
              if [ -n "$EXPECTED_CERT_SHA256" ]; then
                case "$CERT_SHA" in
                  ${EXPECTED_CERT_SHA256}*) echo "Signer cert OK: $CERT_SHA" ;;
                  *) echo "::error::$apk signed by unexpected certificate ($CERT_SHA); expected prefix ${EXPECTED_CERT_SHA256}"; exit 1 ;;
                esac
              fi
            done
            echo "All APK signatures valid."
          fi
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Prepare Release Notes & Compatibility Notice
        env:
          TAG: ${{ inputs.tag_name }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          CLEAN_TAG="${TAG#v}"
          cat << 'EOF' | sed 's/^ *//' > notice.md
          ### 📦 Download Packages & Compatibility

          | Package | Recommended OS | Description |
          | :--- | :--- | :--- |
          | **`Aura-v__TAG__-universal.apk`** (~22 MB) | **Android 10+ (Android 10 – 16+)** | **Standard Recommended Release.** R8-optimized with uncompressed page-aligned native libraries for instant memory mapping. |
          | **`Aura-v__TAG__-universal-uncompressed.apk`** (~89 MB) | **Android 10+ (Android 10 – 16+)** | **Raw Release.** Unminified debuggable variant with uncompressed native libraries. |
          | **`Aura-v__TAG__-android7.apk`** (~17 MB) | **Android 7.0 – 9.0 (Legacy)** | **Legacy Android 7.0+ Variant.** Built with compressed native libraries for older package managers. |

          > [!NOTE]
          > **Android Version Recommendations:**
          > - For devices running Android 10 or newer, install the standard **`Aura-v__TAG__-universal.apk`**.
          > - Hardware GPU glassmorphism and live blur require Android 12+ and automatically gracefully fall back to translucent canvas acrylic styling on older devices.
          EOF

          sed -i "s/__TAG__/${CLEAN_TAG}/g" notice.md

          if [ -n "$NOTES" ]; then
            printf "%s\n\n---\n\n" "$NOTES" > release_body.md
            cat notice.md >> release_body.md
          else
            cat notice.md > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          body_path: release_body.md
          files: |
            final_apk/*.apk
            final_apk/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
